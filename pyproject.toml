[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-workbench"
version = "2.2.1"
description = "Collect free public proxies and keep only the ones that work for your services: local GUI + CLI checker for HTTP, HTTPS and SOCKS5"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Proxy Workbench contributors" },
]
keywords = ["proxy", "proxy-checker", "proxy-list", "free-proxy", "proxy-scraper", "http", "https", "socks5", "dnsbl", "benchmark"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx[socks]==0.28.1",
]

[project.urls]
Homepage = "https://davidvoitenko.github.io/proxy-workbench/"
Source = "https://github.com/DavidVoitenko/proxy-workbench"
Changelog = "https://github.com/DavidVoitenko/proxy-workbench/blob/main/CHANGELOG.md"
Issues = "https://github.com/DavidVoitenko/proxy-workbench/issues"

[project.scripts]
proxy-workbench = "proxy_workbench.__main__:main"

[tool.setuptools]
packages = ["proxy_workbench"]

[tool.setuptools.package-data]
proxy_workbench = ["sources.json", "ui/*"]
