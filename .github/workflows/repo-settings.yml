name: Repository settings

# Applies .github/repo-settings.json (description, homepage, topics,
# Discussions, GitHub Pages). Run it from the Actions tab. It needs a
# repository secret REPO_ADMIN_TOKEN: a fine-grained token for this
# repository only with "Administration" and "Pages" read/write access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Apply settings
        env:
          TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret REPO_ADMIN_TOKEN first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/')
          api = f'https://api.github.com/repos/{repo}'
          settings = json.load(open('.github/repo-settings.json', encoding='utf-8'))

          def call(method, url, body=None, ok=(200, 201, 204)):
              request = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body is not None else None,
                                               headers={'Authorization': 'Bearer ' + os.environ['TOKEN'],
                                                        'Accept': 'application/vnd.github+json',
                                                        'X-GitHub-Api-Version': '2022-11-28',
                                                        'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  if error.code in ok:
                      return error.code
                  print(f'{method} {url} -> {error.code}: {error.read().decode()[:300]}')
                  return error.code

          pages = settings['pages']
          source = {'branch': pages['branch'], 'path': pages['path']}
          status = call('POST', f'{api}/pages', {'build_type': 'legacy', 'source': source}, ok=(201,))
          if status == 409:  # already enabled: update the source instead
              status = call('PUT', f'{api}/pages', {'build_type': 'legacy', 'source': source}, ok=(204,))
          print('pages', status)

          fields = {key: settings[key] for key in ('description', 'has_discussions', 'has_issues', 'has_wiki', 'has_projects')}
          if settings.get('homepage_from_pages'):
              fields['homepage'] = f'https://{owner.lower()}.github.io/{name}/'
          print('repository', call('PATCH', api, fields))
          print('topics', call('PUT', f'{api}/topics', {'names': settings['topics']}))
          PY
