name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  local-mock-unit-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      # The test suite uses temporary data and local HTTP/DNS mocks.
      # Do not replace this command with a live proxy scan or network check.
      - name: Run local mock unit tests
        env:
          ALL_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: python packaging/run_tests.py

      - name: Check UI JavaScript syntax
        run: node --check proxy_workbench/ui/app.js

  # Builds what users install and runs a GUI -> check -> API -> gateway flow against local mocks.
  # macOS is intentionally covered as an installed wheel/source-package path; this job does
  # not claim to produce or validate a signed .app/.dmg.
  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      ALL_PROXY: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "127.0.0.1,localhost"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check source launcher syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n run.sh
          sh -n Start.command

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and install it like pipx does
        shell: bash
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip wheel --no-deps --wheel-dir dist .
          python packaging/verify_wheel.py dist/*.whl
          python -m venv install-test
          if [ -x install-test/bin/python ]; then bin=install-test/bin; else bin=install-test/Scripts; fi
          "$bin/python" -m pip install dist/*.whl
          echo "INSTALLED=$bin/proxy-workbench" >> "$GITHUB_ENV"

      - name: Smoke test the installed command
        run: python packaging/smoke.py ${{ env.INSTALLED }}

      - name: Smoke test the source entry point
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python packaging/smoke.py python -m proxy_workbench

      - name: Build the Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller==6.22.3
          pyinstaller --noconfirm packaging/proxy-workbench.spec

      - name: Smoke test the Windows executable
        if: runner.os == 'Windows'
        run: python packaging/smoke.py dist/proxy-workbench.exe

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build CLI image
        run: docker build --tag proxy-workbench:ci .

      # Smoke test only: no scan, no network checks.
      - name: Run CLI inside the image
        run: |
          docker run --rm proxy-workbench:ci --version
          docker run --rm proxy-workbench:ci --help > /dev/null
          docker run --rm proxy-workbench:ci clear-data --yes
          docker run --rm --entrypoint python proxy-workbench:ci -c "from proxy_workbench import source_catalog; assert source_catalog.load_bundled()['sources']"

  # The .app users install (F23).  This job builds it on a real macOS runner,
  # starts it, and checks the page it serves, its per-user data folder, a second
  # start and the untouched bundle.  It is unsigned - no identity exists in
  # this project - and the manifest says so.
  #
  # --no-tray: the menu bar helper is compiled and put into the bundle here,
  # and its presence is checked, but a build machine has no logged-in user to
  # show a menu bar to.  Whether the status item actually appears is verified
  # by a run of packaging/build_macos.py without that flag, and the manifest
  # records "checked: false" rather than a claim.
  macos-artifact:
    name: macOS .app / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    env:
      ALL_PROXY: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "127.0.0.1,localhost"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt pyinstaller==6.22.3

      - name: Build and verify the .app
        run: python packaging/build_macos.py --dist dist --arch ${{ matrix.arch }} --no-dmg --no-tray

      - name: Smoke test the built application
        run: python packaging/smoke.py "dist/Proxy Workbench.app/Contents/MacOS/Proxy Workbench"

      - name: Report what the build recorded
        run: |
          python - <<'PY'
          import json, glob
          manifest = json.load(open(glob.glob('dist/*.manifest.json')[0]))
          print('version:  ', manifest['version'])
          print('bundle:   ', manifest['bundle']['signature'])
          print('menu bar: ', json.dumps(manifest['menu_bar'], ensure_ascii=False))
          print('launch:   ', json.dumps(manifest['verified']['detail']['second_launch'], ensure_ascii=False))
          assert manifest['verified']['launched'], 'the built app was not launched'
          assert manifest['menu_bar']['helper'], 'the menu bar helper is not in the bundle'
          PY

      - name: Verify the manifest against the files on disk
        run: python packaging/verify_release.py "$(ls dist/*.manifest.json)"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-workbench-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/Proxy Workbench.app
            dist/proxy-workbench-*.zip
            dist/proxy-workbench-*.manifest.json
