name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  local-mock-unit-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      # The test suite uses temporary data and local HTTP/DNS mocks.
      # Do not replace this command with a live proxy scan or network check.
      - name: Run local mock unit tests
        env:
          ALL_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: python -m unittest discover -s tests -v

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build CLI image
        run: docker build --tag proxy-workbench:ci .

      # Smoke test only: no scan, no network checks.
      - name: Run CLI inside the image
        run: |
          docker run --rm proxy-workbench:ci --version
          docker run --rm proxy-workbench:ci --help > /dev/null
          docker run --rm proxy-workbench:ci clear-data --yes
