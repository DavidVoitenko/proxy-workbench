name: Source release

# Runs on a pushed v* tag, or manually from the Actions tab
# ("Run workflow", enter e.g. v1.3.0), which creates the tag on the
# selected branch's latest commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.3.0'
        required: true

permissions:
  contents: write

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

jobs:
  source-archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag matches product version
        run: |
          version=$(python -c 'from proxy_workbench import branding; print(branding.PRODUCT_VERSION)')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match PRODUCT_VERSION $version" >&2
            exit 1
          fi
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run local mock tests
        env:
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: 127.0.0.1,localhost
        run: python -m unittest discover -s tests -v
      - name: Build reproducible source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=proxy-workbench/ -o "dist/proxy-workbench-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum "proxy-workbench-${TAG}.tar.gz" > "proxy-workbench-${TAG}.tar.gz.sha256")
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v version="${TAG#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "See CHANGELOG.md." > dist/notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Proxy Workbench ${{ env.TAG }}
          body_path: dist/notes.md
          generate_release_notes: true
          files: |
            dist/proxy-workbench-*.tar.gz
            dist/proxy-workbench-*.tar.gz.sha256

  python-package:
    needs: source-archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and smoke test the wheel
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip wheel --no-deps --wheel-dir dist .
          python packaging/verify_wheel.py dist/*.whl
          python -m venv install-test
          install-test/bin/python -m pip install dist/*.whl
          python packaging/smoke.py install-test/bin/proxy-workbench
      - name: Attach the wheel to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.whl

  # The two Windows binaries F23 asks for: a windowed GUI and a separate
  # console CLI, plus the per-user installer.  Nothing here is signed - a
  # certificate would have to exist in the runner's certificate store and be
  # named by PROXY_WORKBENCH_SIGN_THUMBPRINT, and until one does the manifest
  # records signed: false for every artifact.
  windows-desktop:
    needs: source-archive
    runs-on: windows-2022
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build, verify and package the desktop artifact
        run: |
          python -m pip install --requirement requirements.txt pyinstaller==6.22.3
          python packaging/build_windows.py --dist dist --installer
          python packaging/smoke.py dist/proxy-workbench-cli.exe
          python packaging/verify_release.py (Get-ChildItem dist/proxy-workbench-*.manifest.json).FullName
      - name: Checksum the artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/proxy-workbench-gui.exe
            dist/proxy-workbench-cli.exe
            dist/proxy-workbench-*-windows-x64-portable.zip
            dist/proxy-workbench-*-windows-x64-setup.exe
            dist/proxy-workbench-*.manifest.json
            dist/*.sha256

  # The macOS .app and its .dmg.  Unsigned unless a Developer ID identity and
  # notarization credentials are provided as repository secrets
  # (MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD / MACOS_KEYCHAIN_PASSWORD
  # and APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID).  Without them the build
  # runs unsigned, the manifest says signed: false, and the release note has to
  # say the same: an ad-hoc signature is not a publisher.
  macos-desktop:
    needs: source-archive
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt pyinstaller==6.22.3
      - name: Import the signing identity, if one is configured
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import "$MACOS_CERTIFICATE" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
      - name: Build, verify and package the .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags="--dist dist --arch ${{ matrix.arch }} --no-tray"
          if [ -n "$APPLE_ID" ]; then flags="$flags --sign --notarize"; fi
          # shellcheck disable=SC2086
          python packaging/build_macos.py $flags
          python packaging/verify_release.py "$(ls dist/*.manifest.json)"
      - name: Checksum the artifacts
        run: |
          cd dist
          shasum -a 256 proxy-workbench-*.zip proxy-workbench-*.dmg proxy-workbench-*.manifest.json > SHA256SUMS-macos-${{ matrix.arch }}
      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/proxy-workbench-*-macos-${{ matrix.arch }}.zip
            dist/proxy-workbench-*-macos-${{ matrix.arch }}.dmg
            dist/proxy-workbench-*.manifest.json
            dist/SHA256SUMS-macos-${{ matrix.arch }}

  container-image:
    needs: source-archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=Proxy Workbench CLI: collect and check public proxies" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --tag "$image:${TAG#v}" --tag "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          docker push "$image:${TAG#v}"
          docker push "$image:latest"
