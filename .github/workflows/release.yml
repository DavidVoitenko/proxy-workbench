name: Source release

# Runs on a pushed v* tag, or manually from the Actions tab
# ("Run workflow", enter e.g. v1.3.0), which creates the tag on the
# selected branch's latest commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.3.0'
        required: true

permissions:
  contents: write

jobs:
  source-archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag matches product version
        run: |
          version=$(python -c 'from proxy_workbench import branding; print(branding.PRODUCT_VERSION)')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match PRODUCT_VERSION $version" >&2
            exit 1
          fi
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run local mock tests
        env:
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: 127.0.0.1,localhost
        run: python -m unittest discover -s tests -v
      - name: Build reproducible source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=proxy-workbench/ -o "dist/proxy-workbench-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum "proxy-workbench-${TAG}.tar.gz" > "proxy-workbench-${TAG}.tar.gz.sha256")
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v version="${TAG#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "See CHANGELOG.md." > dist/notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Proxy Workbench ${{ env.TAG }}
          body_path: dist/notes.md
          generate_release_notes: true
          files: |
            dist/proxy-workbench-*.tar.gz
            dist/proxy-workbench-*.tar.gz.sha256

  python-package:
    needs: source-archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and smoke test the wheel
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv install-test
          install-test/bin/python -m pip install dist/*.whl
          python packaging/smoke.py install-test/bin/proxy-workbench
      - name: Attach the wheel to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.whl

  windows-executable:
    needs: source-archive
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the executable
        run: |
          python -m pip install --requirement requirements.txt pyinstaller==6.22.3
          pyinstaller --noconfirm packaging/proxy-workbench.spec
      - name: Smoke test the executable
        run: python packaging/smoke.py dist/proxy-workbench.exe
      - name: Name and checksum the executable
        shell: bash
        run: |
          name="proxy-workbench-${TAG}-windows-x64.exe"
          mv dist/proxy-workbench.exe "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - name: Attach the executable to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/proxy-workbench-*-windows-x64.exe
            dist/proxy-workbench-*-windows-x64.exe.sha256

  container-image:
    needs: source-archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=Proxy Workbench CLI: collect and check public proxies" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --tag "$image:${TAG#v}" --tag "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          docker push "$image:${TAG#v}"
          docker push "$image:latest"
