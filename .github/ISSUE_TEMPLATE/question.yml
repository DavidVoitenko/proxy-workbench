name: Question / Вопрос
description: Ask how to use Proxy Workbench or discuss an idea
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Questions in English or Russian are welcome. Do not include credentials, private proxy endpoints, personal data or live scan results. Report security issues privately as described in SECURITY.md.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Proxy Workbench version
      placeholder: "1.4.0"
    validations:
      required: false
